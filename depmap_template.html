<title>Foundations Wiring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: a full-bleed schematic with a fixed instrument rail above it and
     an inspector that slides over the canvas edge rather than reflowing it.
     Tokens borrowed from Foundations Trading's own :root so the map reads as
     part of the program, including the rule that the 106C yellow is a FILL
     behind dark text and never a foreground. */
  :root {
    color-scheme: light;
    --bg:        #eef0f4;
    --surface:   #ffffff;
    --surface-2: #e9ecf2;
    --sunk:      #e3e6ed;
    --ink:       #2b3a52;
    --ink-dim:   #616e84;
    --ink-faint: #8290a5;
    --rule:      #d7dce6;
    --rule-firm: #b9c1d0;
    --royal:     #3457C5;
    --yellow:    #F9E04C;
    --red:       #c0392b;
    --amber:     #B4530A;
    --green:     #1e7e4d;
    --edge:      #9aa8bd;
    --shadow-rgb: 43,58,82;
    --r-engine:     #3457C5;
    --r-screener:   #0f7b7b;
    --r-journal:    #a8620a;
    --r-backtester: #6b3fa0;
    --r-routing:    #c0392b;
    --r-broker:     #4a5a73;
    --r-config:     #1e7e4d;
    --r-ledger:     #a8336a;
    --r-legacy:     #9aa3b2;
    --r-tooling:    #0a6f8f;
    --r-support:    #2b3a52;
    --ff:     'IBM Plex Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    --ff-num: 'IBM Plex Mono', 'Consolas', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #151b25; --surface: #1d2532; --surface-2: #26303f; --sunk: #121821;
      --ink: #e6eaf1; --ink-dim: #9aa8bd; --ink-faint: #74839a;
      --rule: #2f3a4b; --rule-firm: #435065;
      --royal: #8ba6f0; --yellow: #F9E04C;
      --red: #f07a6c; --amber: #e08a3c; --green: #4cc98a;
      --edge: #46556e;
      --shadow-rgb: 0,0,0;
      --r-engine: #8ba6f0; --r-screener: #3fc0bd; --r-journal: #e0a44c;
      --r-backtester: #b08ae8; --r-routing: #f07a6c; --r-broker: #8c9cb8;
      --r-config: #4cc98a; --r-ledger: #e87aae; --r-legacy: #5d6878;
      --r-tooling: #4fb8d8; --r-support: #c3cfe2;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151b25; --surface: #1d2532; --surface-2: #26303f; --sunk: #121821;
    --ink: #e6eaf1; --ink-dim: #9aa8bd; --ink-faint: #74839a;
    --rule: #2f3a4b; --rule-firm: #435065;
    --royal: #8ba6f0; --yellow: #F9E04C;
    --red: #f07a6c; --amber: #e08a3c; --green: #4cc98a;
    --edge: #46556e;
    --shadow-rgb: 0,0,0;
    --r-engine: #8ba6f0; --r-screener: #3fc0bd; --r-journal: #e0a44c;
    --r-backtester: #b08ae8; --r-routing: #f07a6c; --r-broker: #8c9cb8;
    --r-config: #4cc98a; --r-ledger: #e87aae; --r-legacy: #5d6878;
    --r-tooling: #4fb8d8; --r-support: #c3cfe2;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--ff); font-size: 14px; line-height: 1.45;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  :focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ── rail ── */
  .rail {
    flex: 0 0 auto; background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: 10px 16px; padding-block-start: calc(10px);
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: baseline;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-dim); font-size: 12.5px; }
  .stamp { font-family: var(--ff-num); font-size: 11.5px; color: var(--ink-faint); }
  .rail .grow { flex: 1 1 auto; }
  .stat { font-family: var(--ff-num); font-size: 12px; color: var(--ink-dim); }
  .stat b { color: var(--ink); font-weight: 600; }

  .ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; width: 100%; }
  button, select, input {
    font-family: var(--ff); font-size: 12.5px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--rule-firm);
    border-radius: 5px; padding: 4px 9px; cursor: pointer;
  }
  button:hover { border-color: var(--royal); }
  button[aria-pressed="true"] {
    background: var(--royal); color: #fff; border-color: var(--royal);
  }
  input[type="search"] { cursor: text; min-width: 130px; flex: 0 1 190px; }
  .hint { font-size: 11.5px; color: var(--ink-faint); }

  /* ── stage ── */
  .stage { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px;
    display: flex; flex-wrap: wrap; gap: 3px 11px; max-width: min(520px, calc(100% - 24px));
    backdrop-filter: blur(6px);
  }
  .lg { font-size: 11.5px; color: var(--ink-dim); display: flex;
        align-items: center; gap: 5px; cursor: pointer; }
  .lg .sw { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
  .lg[aria-pressed="false"] { opacity: .35; }

  .inspector {
    position: absolute; right: 12px; top: 12px; z-index: 3;
    width: min(330px, calc(100% - 24px));
    max-height: calc(100% - 24px); overflow: auto;
    background: var(--surface); border: 1px solid var(--rule-firm);
    border-left: 3px solid var(--royal); border-radius: 8px;
    padding: 11px 13px;
    box-shadow: 0 6px 20px -6px rgba(var(--shadow-rgb), .22);
  }
  .inspector h2 { font-family: var(--ff-num); font-size: 14.5px; margin: 0 0 2px;
                  font-weight: 600; word-break: break-all; }
  .inspector .role { font-size: 11px; text-transform: uppercase;
                     letter-spacing: .06em; color: var(--ink-dim); }
  .inspector .doc { font-size: 12.5px; color: var(--ink-dim); margin: 7px 0 0; }
  .grp { margin-top: 10px; }
  .grp h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--ink-faint); margin: 0 0 4px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font-family: var(--ff-num); font-size: 11.5px; padding: 1px 7px;
    border-radius: 999px; border: 1px solid var(--rule-firm);
    color: var(--ink-dim); background: var(--sunk); cursor: pointer;
  }
  .chip:hover { border-color: var(--royal); color: var(--royal); }
  .chip.def { border-style: dashed; }
  .flags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .flag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
          padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .flag.t { background: var(--green); color: #fff; }
  .flag.r { background: var(--royal); color: #fff; }
  .flag.s { background: var(--amber); color: #fff; }
  .flag.o { background: var(--yellow); color: #2b3a52; }
  .rt { font-family: var(--ff-num); font-size: 11.5px; color: var(--ink-dim);
        display: block; }

  .findings {
    flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--rule);
    padding: 10px 16px; padding-block-end: calc(10px + env(safe-area-inset-bottom, 0px));
    font-size: 12.5px;
  }
  .findings h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--ink-faint); margin: 0 0 5px; font-weight: 600; }
  .find { margin-bottom: 3px; color: var(--ink-dim); }
  .find b { color: var(--ink); font-family: var(--ff-num); font-weight: 600; }
  .find.bad b { color: var(--red); }
  .empty { color: var(--ink-faint); font-style: italic; }

  @media (max-width: 620px) {
    .inspector { position: static; width: auto; max-height: 40vh;
                 margin: 0 16px 12px; }
    .legend { position: static; margin: 12px 16px 0; max-width: none; }
    .stage { display: flex; flex-direction: column; }
    canvas { height: 46vh; flex: 0 0 auto; }
  }
</style>

<div class="rail">
  <h1>Foundations Wiring</h1>
  <span class="sub">every module, and what it reaches for</span>
  <span class="grow"></span>
  <span class="stamp" id="stamp"></span>
  <div class="ctl">
    <span class="stat" id="totals"></span>
    <span class="grow"></span>
    <input type="search" id="q" placeholder="find a module" aria-label="Find a module">
    <button id="bDef" aria-pressed="true" title="imports made inside a function body, usually to break a cycle">deferred edges</button>
    <button id="bLegacy" aria-pressed="false" title="the six patch_*.py files and the two tooling scripts">dead weight</button>
    <button id="bCluster" aria-pressed="true" title="pull each role toward its own centre">cluster by role</button>
    <button id="bLabels" aria-pressed="true">labels</button>
    <button id="bReheat">shake</button>
  </div>
</div>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="legend" id="legend"></div>
  <div class="inspector" id="insp"></div>
</div>

<div class="findings" id="findings"></div>

<script type="application/json" id="graph">/*__GRAPH__*/</script>
<script>
(function () {
  'use strict';
  var G = JSON.parse(document.getElementById('graph').textContent);

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var showDef = true, showLegacy = false, cluster = true, showLabels = true;
  var hidden = {};               // role -> true
  var hoverId = null, pinId = null, dragId = null, query = '';

  /* Token values are read ONCE into a cache and refreshed when the theme
     changes. Reading them per node per frame means ~165 getComputedStyle
     calls every 16ms, which is the difference between a smooth graph and a
     janky one -- and getComputedStyle forces style recalc. */
  var PAL = {};
  function readPalette() {
    var cs = getComputedStyle(document.documentElement);
    ['--ink', '--ink-dim', '--ink-faint', '--edge', '--royal', '--green',
     '--ff-num'].forEach(function (k) {
      PAL[k] = cs.getPropertyValue(k).trim();
    });
    (G.roles || []).forEach(function (r) {
      PAL['--r-' + r] = cs.getPropertyValue('--r-' + r).trim() || PAL['--ink'];
    });
  }
  function css(n) { return PAL[n] || ''; }
  function roleColor(role) { return PAL['--r-' + role] || PAL['--ink']; }
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', readPalette);
    } catch (e) { /* older engines: the palette stays as first read */ }
  }
  // An explicit theme choice lands as a data-theme attribute on <html>.
  if (window.MutationObserver) {
    new MutationObserver(readPalette).observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
  }

  /* ── model ──
     One node per module. An edge is an import; `deferred` means the import
     sits inside a function body, which in this repo is how cycles are broken
     on purpose, so it is drawn differently rather than hidden. */
  var mods = G.modules.filter(function (m) { return !m.error; });
  var byId = {};
  var nodes = mods.map(function (m, i) {
    var a = (i / mods.length) * Math.PI * 2;
    var n = {
      id: m.module, role: m.role, lines: m.lines, doc: m.doc,
      routes: m.routes || [], stores: m.stores || [], selftest: m.selftest,
      out: (m.imports || []).map(function (e) { return e.to; }),
      outDef: (m.imports || []).filter(function (e) { return e.deferred; })
        .map(function (e) { return e.to; }),
      inn: (G.imported_by[m.module] || []).slice(),
      orphan: G.orphans.indexOf(m.module) >= 0,
      x: Math.cos(a) * 180 + (Math.random() - .5) * 40,
      y: Math.sin(a) * 180 + (Math.random() - .5) * 40,
      vx: 0, vy: 0
    };
    byId[n.id] = n;
    return n;
  });
  nodes.forEach(function (n) {
    n.r = Math.max(4.5, Math.min(16, 3.4 + Math.sqrt(n.lines) * 0.42));
    n.deg = n.out.length + n.inn.length;
  });

  var edges = [];
  mods.forEach(function (m) {
    (m.imports || []).forEach(function (e) {
      if (byId[m.module] && byId[e.to]) {
        edges.push({ s: byId[m.module], t: byId[e.to], def: !!e.deferred });
      }
    });
  });

  var roles = G.roles.slice().sort();
  var roleCentre = {};
  function layoutRoles() {
    roles.forEach(function (r, i) {
      var a = (i / roles.length) * Math.PI * 2 - Math.PI / 2;
      roleCentre[r] = { x: Math.cos(a) * Math.min(W, H) * 0.29,
                        y: Math.sin(a) * Math.min(W, H) * 0.29 };
    });
  }

  function isDead(n) { return n.role === 'legacy' || n.role === 'tooling'; }
  function visible(n) {
    if (hidden[n.role]) return false;
    if (!showLegacy && isDead(n)) return false;
    return true;
  }

  /* ── force layout ──
     Hand-rolled on purpose: 50 nodes needs repulsion, springs and a little
     centring, which is forty lines. A charting library would be a bigger
     dependency than the thing it draws. */
  var alpha = 1;
  function step() {
    var vis = nodes.filter(visible);
    for (var i = 0; i < vis.length; i++) {
      var a = vis[i];
      for (var j = i + 1; j < vis.length; j++) {
        var b = vis[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy || 0.01;
        var d = Math.sqrt(d2);
        var push = 2600 / d2;
        var ux = dx / d, uy = dy / d;
        a.vx -= ux * push; a.vy -= uy * push;
        b.vx += ux * push; b.vy += uy * push;
        var minD = a.r + b.r + 6;
        if (d < minD) {
          var o = (minD - d) * 0.5;
          a.vx -= ux * o; a.vy -= uy * o;
          b.vx += ux * o; b.vy += uy * o;
        }
      }
    }
    edges.forEach(function (e) {
      if (!visible(e.s) || !visible(e.t)) return;
      if (e.def && !showDef) return;
      var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var rest = 96, k = e.def ? 0.012 : 0.03;
      var f = (d - rest) * k;
      var ux = dx / d, uy = dy / d;
      e.s.vx += ux * f; e.s.vy += uy * f;
      e.t.vx -= ux * f; e.t.vy -= uy * f;
    });
    vis.forEach(function (n) {
      if (cluster && roleCentre[n.role]) {
        n.vx += (roleCentre[n.role].x - n.x) * 0.014;
        n.vy += (roleCentre[n.role].y - n.y) * 0.014;
      } else {
        n.vx += -n.x * 0.004; n.vy += -n.y * 0.004;
      }
      if (n === dragId) { n.vx = n.vy = 0; return; }
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx * alpha; n.y += n.vy * alpha;
      var lim = Math.min(W, H) * 0.47;
      var m = Math.sqrt(n.x * n.x + n.y * n.y);
      if (m > lim) { n.x = n.x / m * lim; n.y = n.y / m * lim; }
    });
    alpha = Math.max(0.25, alpha * 0.995);
  }

  /* ── focus: the node under the cursor, or the pinned one ── */
  function focusId() { return hoverId || pinId; }
  function related(id) {
    var n = byId[id];
    if (!n) return null;
    var set = {};
    set[id] = 'self';
    n.out.forEach(function (t) { set[t] = set[t] || 'out'; });
    n.inn.forEach(function (s) { set[s] = set[s] || 'in'; });
    return set;
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);

    var fid = focusId();
    var rel = fid ? related(fid) : null;
    var q = query.trim().toLowerCase();

    // edges first, so nodes sit on top
    edges.forEach(function (e) {
      if (!visible(e.s) || !visible(e.t)) return;
      if (e.def && !showDef) return;
      var on = !rel || (rel[e.s.id] && rel[e.t.id] &&
                        (e.s.id === fid || e.t.id === fid));
      ctx.beginPath();
      ctx.moveTo(e.s.x, e.s.y);
      ctx.lineTo(e.t.x, e.t.y);
      ctx.strokeStyle = on ? (rel ? roleColor(e.s.role) : css('--edge')) : css('--edge');
      ctx.globalAlpha = on ? (rel ? 0.85 : 0.3) : 0.06;
      ctx.lineWidth = on && rel ? 1.6 : 0.8;
      if (e.def) { ctx.setLineDash([3, 3]); } else { ctx.setLineDash([]); }
      ctx.stroke();
      ctx.setLineDash([]);
      // direction tick: a short mark near the TARGET, so "who imports whom"
      // is readable without arrowheads cluttering a 114-edge hairball
      if (on && rel) {
        var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var px = e.t.x - dx / d * (e.t.r + 5), py = e.t.y - dy / d * (e.t.r + 5);
        ctx.beginPath();
        ctx.arc(px, py, 2.1, 0, Math.PI * 2);
        ctx.fillStyle = roleColor(e.s.role);
        ctx.globalAlpha = 0.95;
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;

    nodes.forEach(function (n) {
      if (!visible(n)) return;
      var dim = rel ? !rel[n.id] : false;
      var hit = q && n.id.toLowerCase().indexOf(q) >= 0;
      ctx.globalAlpha = dim ? 0.16 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = roleColor(n.role);
      ctx.fill();
      if (n.id === fid) {
        ctx.lineWidth = 2.5; ctx.strokeStyle = css('--ink'); ctx.stroke();
      } else if (hit) {
        ctx.lineWidth = 2.5; ctx.strokeStyle = css('--royal'); ctx.stroke();
      } else if (n.orphan) {
        // nothing imports it and it serves no route
        ctx.lineWidth = 1.6; ctx.setLineDash([2, 2]);
        ctx.strokeStyle = css('--ink-faint'); ctx.stroke(); ctx.setLineDash([]);
      }
      if (n.selftest) {
        ctx.beginPath();
        ctx.arc(n.x + n.r * 0.72, n.y - n.r * 0.72, 2.6, 0, Math.PI * 2);
        ctx.fillStyle = css('--green'); ctx.fill();
      }
      if (showLabels && (!dim || hit)) {
        ctx.globalAlpha = dim ? 0.5 : 1;
        ctx.font = (n.id === fid ? '600 ' : '') + '11px ' + css('--ff-num');
        ctx.fillStyle = css('--ink');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(n.id, n.x, n.y + n.r + 3);
      }
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function frame() { step(); draw(); requestAnimationFrame(frame); }

  /* ── hit testing ── */
  function at(mx, my) {
    var x = mx - W / 2, y = my - H / 2, best = null, bd = 1e9;
    nodes.forEach(function (n) {
      if (!visible(n)) return;
      var d = Math.hypot(n.x - x, n.y - y);
      if (d < n.r + 7 && d < bd) { bd = d; best = n; }
    });
    return best;
  }
  function pos(ev) {
    var r = cv.getBoundingClientRect();
    return [ev.clientX - r.left, ev.clientY - r.top];
  }
  cv.addEventListener('pointermove', function (ev) {
    var p = pos(ev);
    if (dragId) {
      dragId.x = p[0] - W / 2; dragId.y = p[1] - H / 2;
      alpha = Math.max(alpha, 0.6);
      return;
    }
    var n = at(p[0], p[1]);
    var id = n ? n.id : null;
    if (id !== hoverId) { hoverId = id; renderInspector(); }
    cv.style.cursor = n ? 'pointer' : 'default';
  });
  cv.addEventListener('pointerdown', function (ev) {
    var p = pos(ev), n = at(p[0], p[1]);
    if (n) { dragId = n; pinId = n.id; cv.setPointerCapture(ev.pointerId); }
    else { pinId = null; }
    renderInspector();
  });
  cv.addEventListener('pointerup', function () { dragId = null; });
  cv.addEventListener('pointerleave', function () {
    if (!dragId) { hoverId = null; renderInspector(); }
  });

  /* ── inspector ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
               '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function chipList(ids, defSet) {
    if (!ids.length) return '<span class="empty">none</span>';
    return ids.slice().sort().map(function (id) {
      var d = defSet && defSet.indexOf(id) >= 0;
      return '<span class="chip' + (d ? ' def' : '') + '" data-go="' + esc(id) +
        '"' + (d ? ' title="imported inside a function body"' : '') + '>' +
        esc(id) + '</span>';
    }).join('');
  }
  function renderInspector() {
    var host = document.getElementById('insp');
    var id = focusId(), n = id && byId[id];
    if (!n) {
      host.innerHTML =
        '<h2>Nothing selected</h2>' +
        '<div class="role">' + nodes.length + ' modules · ' + edges.length + ' edges</div>' +
        '<p class="doc">Hover a node to light up what it imports and what ' +
        'imports it. Click to pin, drag to pull it loose. Dashed rings are ' +
        'modules nothing imports; a green pip means the file carries its own ' +
        'selftest.</p>';
      return;
    }
    var h = '<h2>' + esc(n.id) + '.py</h2>' +
      '<div class="role" style="color:' + roleColor(n.role) + '">' +
      esc(n.role) + ' · ' + n.lines.toLocaleString() + ' lines</div>';
    var fl = [];
    if (n.selftest) fl.push('<span class="flag t">selftest</span>');
    if (n.routes.length) fl.push('<span class="flag r">' + n.routes.length + ' routes</span>');
    if (n.stores.length) fl.push('<span class="flag s">writes state</span>');
    if (n.orphan) fl.push('<span class="flag o">unimported</span>');
    if (fl.length) h += '<div class="flags">' + fl.join('') + '</div>';
    if (n.doc) h += '<p class="doc">' + esc(n.doc) + '</p>';
    h += '<div class="grp"><h3>imports (' + n.out.length + ')</h3>' +
      '<div class="chips">' + chipList(n.out, n.outDef) + '</div></div>';
    h += '<div class="grp"><h3>imported by (' + n.inn.length + ')</h3>' +
      '<div class="chips">' + chipList(n.inn) + '</div></div>';
    if (n.stores.length) {
      h += '<div class="grp"><h3>runtime state</h3><div class="chips">' +
        n.stores.map(function (s) {
          return '<span class="chip">' + esc(s) + '</span>'; }).join('') +
        '</div></div>';
    }
    if (n.routes.length) {
      h += '<div class="grp"><h3>serves</h3>' +
        n.routes.map(function (r) {
          return '<span class="rt">' + esc(r.methods.join('/')) + ' ' +
            esc(r.path) + '</span>'; }).join('') + '</div>';
    }
    host.innerHTML = h;
  }
  document.getElementById('insp').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-go]');
    if (t) { pinId = t.getAttribute('data-go'); hoverId = null; renderInspector(); }
  });

  /* ── legend doubles as the role filter ── */
  function renderLegend() {
    var counts = {};
    nodes.forEach(function (n) { counts[n.role] = (counts[n.role] || 0) + 1; });
    document.getElementById('legend').innerHTML = roles.map(function (r) {
      return '<span class="lg" role="button" tabindex="0" data-role="' + r +
        '" aria-pressed="' + (hidden[r] ? 'false' : 'true') + '">' +
        '<span class="sw" style="background:' + roleColor(r) + '"></span>' +
        r + ' <span style="color:var(--ink-faint)">' + (counts[r] || 0) + '</span></span>';
    }).join('');
  }
  document.getElementById('legend').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-role]');
    if (!t) return;
    var r = t.getAttribute('data-role');
    hidden[r] = !hidden[r];
    alpha = 0.8; renderLegend();
  });
  document.getElementById('legend').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') {
      var t = ev.target.closest('[data-role]');
      if (t) { ev.preventDefault(); t.click(); }
    }
  });

  /* ── findings: computed, not remembered ── */
  function renderFindings() {
    var h = '';
    var rc = G.route_collisions || [];
    h += '<h3>Route collisions — one of each pair silently wins</h3>';
    h += rc.length ? rc.map(function (c) {
      var who = c.served_by.map(function (d) {
        return d.module + '.' + d.handler + ' [' + d.methods.join('/') + ']';
      }).join('  vs  ');
      var benign = c.served_by.every(function (d) {
        return d.module === c.served_by[0].module; });
      return '<div class="find' + (benign ? '' : ' bad') + '"><b>' + esc(c.path) +
        '</b> — ' + esc(who) + (benign ? ' (same module, split by method)' : '') +
        '</div>';
    }).join('') : '<div class="find empty">None.</div>';
    h += '<h3 style="margin-top:9px">Unimported, and serving no route</h3>';
    h += (G.orphans || []).length
      ? '<div class="find"><b>' + G.orphans.map(esc).join('</b>, <b>') + '</b></div>'
      : '<div class="find empty">None.</div>';
    document.getElementById('findings').innerHTML = h;
  }

  /* ── controls ── */
  function toggle(id, get, set) {
    var b = document.getElementById(id);
    b.addEventListener('click', function () {
      set(!get());
      b.setAttribute('aria-pressed', String(get()));
      alpha = 0.8;
    });
    b.setAttribute('aria-pressed', String(get()));
  }
  toggle('bDef', function () { return showDef; }, function (v) { showDef = v; });
  toggle('bLegacy', function () { return showLegacy; }, function (v) { showLegacy = v; });
  toggle('bCluster', function () { return cluster; }, function (v) { cluster = v; });
  toggle('bLabels', function () { return showLabels; }, function (v) { showLabels = v; });
  document.getElementById('bReheat').addEventListener('click', function () {
    nodes.forEach(function (n) {
      n.vx += (Math.random() - .5) * 26; n.vy += (Math.random() - .5) * 26;
    });
    alpha = 1;
  });
  document.getElementById('q').addEventListener('input', function (ev) {
    query = ev.target.value;
    var q = query.trim().toLowerCase();
    if (q && byId[q]) { pinId = q; renderInspector(); }
  });

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    var r = cv.getBoundingClientRect();
    W = Math.max(240, r.width); H = Math.max(200, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    layoutRoles();
  }
  window.addEventListener('resize', resize);

  var t = G.totals;
  document.getElementById('totals').innerHTML =
    '<b>' + t.modules + '</b> modules · <b>' + t.module_lines.toLocaleString() +
    '</b> lines · <b>' + t.edges + '</b> imports · <b>' + t.routes +
    '</b> routes · <b>' + t.selftests + '</b> selftests';
  document.getElementById('stamp').textContent =
    'HEAD ' + (G.head || '?') + ' · generated ' + (G.generated || '').replace('T', ' ');

  readPalette();
  renderLegend(); renderFindings(); renderInspector(); resize(); frame();
})();
</script>
